[project]
name = "16-weather-prediction"
version = "0.1.0"
description = "Forecast daily temperature for the coming days from historical weather data."
requires-python = ">=3.11"
dependencies = [
    "catboost>=1.2.10",
    "ipykernel>=7.4.0",
    "jinja2>=3.1.6",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "mlflow-skinny>=3.17,<4",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "xgboost>=3.2.0",
]

# The project is installed into .venv in editable mode, so `from src.x import y` works from any folder.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
