[project]
name = "16-weather-prediction"
version = "0.1.0"
description = "Forecast daily temperature for the coming days from historical weather data."
requires-python = ">=3.11,<3.14"
dependencies = [
    "catboost>=1.2.10",
    "hopsworks[python]>=5.2.1",
    "ipykernel>=7.4.0",
    "jinja2>=3.1.6",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "mlflow-skinny>=3.17,<4",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "numpy>=2.4.6",
    "optuna>=5.0.0",
    "pandas>=2.3,<3",
    "pyarrow<26",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "xgboost>=3.2.0",
]

# The project is installed into .venv in editable mode, so `from src.x import y` works from any folder.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
# Pipeline tests stay in the repo; the wheel Hopsworks installs leaves them out
exclude = ["src/*/tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
# Test files in different pipelines may share a name
addopts = "--import-mode=importlib"
markers = [
    "unit: fast tests of one function, no network or disk outside tmp_path",
    "component: tests of one part of the system (feature store, model registry, API) with its real dependencies",
    "system: end to end tests of the running system, from raw data to a served prediction",
]
