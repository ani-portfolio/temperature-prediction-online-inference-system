  leakage_threshold: 0.9
  confirmed_safe: []
  reasoning:
    inputs: Static location columns are known at any time; city lets the model learn each city's level. Redundant
      columns (grid coordinates, country, timezone) are left out. Every same day weather column is on the target
      date, so it would leak the outcome; each is used only as a lag of 2 days.
    steps: Lags 2 and 3 of the target are persistence and the recent trend, lag 7 a weekly view, and lag 364 the
      seasonal anchor. Rolling means over 7 and 28 days end on the last complete day. Two custom features compare
      the last complete day with the day before and with its 28 day mean.
    history: Every lag and window ends at least 2 days before the target date, the horizon set in the framing, because
      requests arrive while the current day is incomplete. Lag 364 is empty for 2024.
    encoding: city is one hot encoded for linear models and ordinal coded for trees, fitted inside each fold. Missing
      lag values are imputed with the median and flagged for linear models; trees use them as missing.
  risks:
    - problem: The suggested inputs used the same day weather columns, and logs of them, on the target row, which
        would leak the outcome.
      resolution: All same day weather columns are out; each is used only as a lag of 2 days.
    - problem: Lag 364 is empty for the first year (about 16,000 training rows).
      resolution: 'Accepted: trees treat it as missing, and the linear preprocessor imputes it with a missing flag.'
  assumptions:
    - The archive's values for past days do not change after they are first published.
  open_questions: []
  decisions:
    - decision: Same day weather columns are used only as lags of 2 days; redundant location columns are left out.
