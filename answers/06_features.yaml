    - apparent_temperature_max_lag_2d
    - temperature_2m_max_lag_3d
  reasoning:
    inputs: Static location columns are known at any time; city lets the model learn each city's level. Country
      comes back as a second location column (V2). Redundant columns (grid coordinates, timezone) are left out.
      Every same day weather column is on the target date, so it would leak the outcome; each is used only as a
      lag of 2 days.
    steps: Lags 2 and 3 of the target are persistence and the recent trend, lag 7 a weekly view, and lag 364 the
      seasonal anchor. Rolling means over 7 and 28 days end on the last complete day. Two custom features compare
      the last complete day with the day before and with its 28 day mean.
    history: Every lag and window ends at least 2 days before the target date, the horizon set in the framing, because
      requests arrive while the current day is incomplete. Lag 364 is empty for 2024.
    encoding: city and country are target encoded with sklearn's TargetEncoder for both linear and tree models (V2
      change from one hot for linear and ordinal codes for trees), fitted inside each fold with internal cross fitting,
      so a row's own target never feeds its encoding; the linear preprocessor also scales them. Missing lag values
      are imputed with the median and flagged for linear models; trees use them as missing.
  risks:
    - problem: The suggested inputs used the same day weather columns, and logs of them, on the target row, which
        would leak the outcome.
      resolution: All same day weather columns are out; each is used only as a lag of 2 days.
    - problem: Lag 364 is empty for the first year (about 16,000 training rows).
      resolution: 'Accepted: trees treat it as missing, and the linear preprocessor imputes it with a missing flag.'
    - problem: The leakage check flagged six lag and rolling features with association above 0.9.
      resolution: 'Confirmed safe by the user: all end on the last complete day or earlier.'
    - problem: Large drift between training and test in the 2 day lags of temperature_2m_min and apparent_temperature_min.
      resolution: 'Expected: the test period is April to September only, while training covers every season. Watch
        the test score by month in the evaluation.'
    - problem: Target encoding replaces each city's one hot intercept (ridge) with a single number, and country
        mostly repeats city (only 6 of 36 countries have more than one city).
      resolution: Tested in iteration 1 (V2) against the V1 LightGBM carried forward on the same folds; kept only
        if it passes the iteration bar.
  assumptions:
    - The archive's values for past days do not change after they are first published.
  open_questions: []
  decisions:
    - decision: Same day weather columns are used only as lags of 2 days; redundant location columns are left out.
      reason: The user confirmed (Q3, Q4) that they are known only from the last complete day.
    - decision: Custom features temp_max_change_1d and temp_max_vs_28d_mean.
      reason: The user asked for them as domain features.
    - decision: 'Confirmed as safe: the target lags 2 and 3, the 7 and 28 day rolling means, and the 2 day lags
        of temperature_2m_mean and apparent_temperature_max, despite associations above 0.9.'
      reason: Each ends at least 2 days before the target date (min_shift_days = 2, enforced by the feature code);
        temperature is persistent, so a high association is expected. Lag 2 is the persistence forecast itself.
    - decision: 'Iteration 1 (V2): city and country are target encoded for both ridge and LightGBM; country is no
        longer excluded.'
      reason: The user asked to test whether a learned level per city and country beats one hot and ordinal codes.
  resolved_questions:
