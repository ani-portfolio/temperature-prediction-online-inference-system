# The Hopsworks jobs of the feature pipeline, applied by `python -m deploy.apply` on every merge to main.
# backfill.py has no job: it reads data/raw, which is not in git, so it runs locally.
jobs:
  feature_pipeline_hourly:
    script: hourly.py            # relative to this jobs/ folder
    args: ""
    schedule: "0 15 * * * ?"     # Quartz cron in UTC: 15 minutes past every hour
    memory_mb: 2048
    cores: 1
