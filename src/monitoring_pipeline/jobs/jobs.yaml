# The Hopsworks job of the monitoring pipeline, applied by `python -m deploy.apply` on every merge to main.
jobs:
  monitoring_pipeline_daily:
    script: daily.py             # relative to this jobs/ folder
    args: ""
    schedule: "0 30 13 * * ?"    # Quartz cron in UTC: daily at 13:30, after the feature job at 12:15 writes yesterday
    memory_mb: 2048
    cores: 1
