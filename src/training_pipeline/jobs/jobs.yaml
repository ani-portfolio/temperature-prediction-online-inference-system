# The Hopsworks jobs of the training pipeline, applied by `python -m deploy.apply` on every merge to main.
# Both run by hand (no schedule): the owner starts training after reading the monitoring reports.
jobs:
  training_pipeline_train:
    script: train.py             # relative to this jobs/ folder
    args: ""
    schedule: null
    memory_mb: 4096
    cores: 2
  training_pipeline_gate:
    script: gate.py
    args: ""                     # the train job passes --version N when it starts this job
    schedule: null
    memory_mb: 2048
    cores: 1
