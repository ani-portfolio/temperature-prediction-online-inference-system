business:
  status: confirmed
  mode: exploratory
  learning_question: Can I build an end to end online inference system (feature store, champion/challenger gate,
    monitoring) that serves next day maximum temperature forecasts for 50 cities, with a model that beats a simple
    persistence forecast (tomorrow's maximum equals the last complete day's maximum)?
  answer_actions:
    - answer: The model clearly beats persistence (for example 10% or more lower error).
      action: Promote it as champion, build the full serving stack around it, and use the gate to judge later challengers.
    - answer: The model only matches persistence.
      action: Still build the system, but serve the persistence forecast as the first champion, then try richer
        features (lags from nearby cities, hourly data) as challengers.
    - answer: The model is worse than persistence.
      action: Look for leakage or a flawed setup first, and ship nothing until it is explained.
  business_goal: null
  business_kpi: null
  decision_supported: null
  users: The project owner, who builds the system and takes the answer action; portfolio readers see the result
    but do not act on the forecasts.
  capacity: null
  current_approach: null
  outcome: Each city's maximum air temperature (2 m, degrees Celsius) for its next local calendar day, predicted
    whenever a request arrives, from that city's weather up to and including the last complete day (normally yesterday).
  output_use: quantity
  v1_bar_intent: Beat the best simple baseline (persistence from the last complete day) by at least 10% lower error
    on CV, then promote the model as champion and build the serving stack around it.
  ml_needed: unsure
  ml_needed_reason: That is what the experiment should find out; a persistence or seasonal baseline may already
    come close.
  constraints:
    latency: Online, on request. Forecasts are served when a request arrives, not as a nightly batch.
    interpretability: null
    fairness: null
    data_access: Open-Meteo free tier only (non commercial, no API key, per minute, hourly, and daily request limits).
    other:
      - Only the 50 cities in the snapshot; requests for other locations are out of scope in V1.
  out_of_scope:
    - Competing with professional weather forecasts, which use numerical weather models this project does not.
    - Locations other than the 50 cities.
    - Forecasts beyond the next day.
  risks:
    - problem: The first draft of the goal was only "build the system end to end", which gives the gate and the
        monitoring no quality bar.
      resolution: The learning question now includes beating a persistence forecast.
    - problem: The first draft assumed forecasts are made the evening before, but requests can arrive at any time,
        when the current day is incomplete.
      resolution: Inputs stop at the last complete day, and training must copy that one day gap so offline results
        match what the live system can do.
    - problem: The model uses only past weather at each city, so it will be far less accurate than professional
        forecasts.
      resolution: Recorded as out of scope; the comparison that matters is against persistence.
