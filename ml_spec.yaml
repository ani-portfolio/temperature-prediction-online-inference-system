assumptions:
  - The forecast is for the next day only (horizon of one day), for the daily maximum temperature at 2 m.
  - The archive API returns the last complete day promptly in production (recent days come from the ECMWF IFS model
    with no delay; ERA5 runs about 5 days behind).
