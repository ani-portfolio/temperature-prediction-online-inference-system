  current: null
  entries:
    - id: 1
      opened_at: '2026-10-20T21:42:03'
      hypothesis: Target-encoding city and country gives both models a meaningful number for each place's typical
        temperature level in place of 50 one-hot columns (ridge) or arbitrary integer codes (LightGBM), and pools
        the cities within a country, which should lower CV MAE against the V1 LightGBM carried forward on the same
        folds.
      diagnosis:
        - The V1 LightGBM champion beats persistence by 14.9% on test (2.080 against 2.443), and ridge is close
          behind (2.146).
        - City is ordinal-encoded for LightGBM (arbitrary codes) and one-hot for ridge (50 columns); it is not among
          the top 10 features.
        - Country is excluded as redundant with city, though 6 of 36 countries have more than one city (United States
          9).
        - Weak slices are high latitude cities; drift between training and test comes from the seasons, and test
          bias is near zero.
      changes:
        - stage: features
          change: Move city from categorical to high_cardinality and bring country back from the excluded list as
            high_cardinality, so both the linear (ridge) and tree (LightGBM) preprocessors target-encode city and
            country with sklearn's TargetEncoder, fitted inside each CV fold.
        - stage: training
          change: Retrain ridge and LightGBM with the same tuning budget (20 trials each), plus the V1 LightGBM
            carried forward with its tuned settings fixed.
      rerun:
        - features
        - baseline
        - training
        - evaluation
