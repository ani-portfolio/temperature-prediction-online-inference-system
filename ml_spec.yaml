framing:
  status: confirmed
  task_type: forecasting
  target:
    name: temperature_2m_max
    definition: The city's maximum air temperature at 2 m (degrees Celsius) on the target date, its local calendar
      day.
    positive_class: null
    outcome_window: The single target day, two days after the last day the inputs may use
    exists_in_data: true
    construction: null
    label_delay: 1 day (known once the target day is complete and in the archive)
  unit_of_prediction: One city on one target date (the city's next local day, seen from a request)
  entity_id_cols:
    - city
  population: All 50 cities in the snapshot, every day
  prediction_time:
    description: Whenever a request arrives during the day before the target date. The current day is incomplete,
      so inputs stop at the last complete day, two days before the target date.
    column: date
    feature_cutoff: End of the local day two days before the target date (the last complete day)
    cadence: Online, on request
    horizon: 2 days
  success:
    primary_metric: MAE
    secondary_metrics:
      - RMSE
      - mean error (bias)
    v1_bar: MAE at least 10% lower than the best simple baseline (persistence, seasonal naive, or moving average)
      on CV, and still lower than it on the test set
    v1_criteria:
      - id: beats_best_baseline_cv
        kind: pct_over_reference
        pct: 10
        'on': cv
      - id: beats_best_baseline_test
        kind: pct_over_reference
        pct: 0
        'on': test
    guardrails: []
  risks:
    - problem: The first draft used date as the last complete day with a shifted target, which later stages would
        not guard.
      resolution: Switched to the forecasting layout (target date rows, horizon 2 days), which the feature and baseline
        stages handle natively.
