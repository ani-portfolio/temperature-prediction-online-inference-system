autopilot: {}
assumptions:
  - The forecast is for the next calendar day only (one day after the request, two days after the last complete
    day), for the daily maximum temperature at 2 m.
  - The archive API returns the last complete day promptly in production (recent days come from the ECMWF IFS model
    with no delay; ERA5 runs about 5 days behind).
  - Persistence from the last complete day is the naive forecast with a 2 day lag.
  - The weather of April to September 2026 is like the weather the system will forecast next.
  - The archive's values for past days do not change after they are first published.
  - The forecast is for the next calendar day only (one day after the request, two days after the last complete
    day), for the daily maximum temperature at 2 m.
  - The Hopsworks free tier is enough for 50 cities, an hourly ingestion job, and an online deployment.
open_questions:
  - id: Q1
    question: What does the system serve when the last complete day is not yet in the archive (stale inputs)?
    stage: system
    raised_by: ml-business-framing
    status: resolved
    answer: Serve persistence from the newest complete day when inputs are stale by up to 3 days or the model fails,
      then the seasonal naive (same date last year); every response flags fallback_used and inputs_as_of. Recorded
      in docs/system_design.md (failure handling).
  - id: Q2
    question: How long should the test period be? 90 days covers only one season; a longer period covers more weather
      but leaves less history for CV.
    stage: split
    raised_by: ml-problem-framing
    status: resolved
    answer: The test period is 182 days (2026-04-03 to 2026-10-01); CV covers the year before it in four 91 day
      folds.
  - id: Q3
    question: 'Is `temperature_2m_mean` known at prediction time? EDA flagged it as possible leakage: association
      with the target is 0.976.'
    stage: features
    raised_by: ml-eda-report
    status: resolved
    answer: temperature_2m_mean is known only 2 or more days later; it is used only as a 2 day lag.
  - id: Q4
    question: 'Is `apparent_temperature_max` known at prediction time? EDA flagged it as possible leakage: association
      with the target is 0.980.'
    stage: features
    raised_by: ml-eda-report
    status: resolved
    answer: apparent_temperature_max is known only 2 or more days later; it is used only as a 2 day lag.
  - id: Q5
    question: Which Hopsworks project and cluster will host the system, and which separate project runs the component
      tests?
    stage: system
    raised_by: ml-system-design
    status: open
decisions:
  - date: '2026-10-20'
    stage: business
    decision: Predict the daily maximum temperature one day ahead, not minimum or mean, and not 1 to 7 days.
    reason: The user chose it to keep V1 focused on building the system end to end.
  - date: '2026-10-20'
    stage: business
    decision: Forecasts are made on request, from inputs up to the last complete day; persistence uses that day's
      maximum.
    reason: Requests can arrive at any time, when the current day is not complete.
  - date: '2026-10-20'
    stage: framing
    decision: Forecasting layout with target temperature_2m_max and a horizon of 2 days.
    reason: Requests arrive when the current day is incomplete, so inputs stop at the last complete day.
  - date: '2026-10-20'
    stage: framing
    decision: MAE is the primary metric; the V1 bar is 10% under the best simple baseline on CV and still under
      it on test.
    reason: The user chose it; it matches the 10% in the answer actions.
  - date: '2026-10-20'
    stage: split
    decision: Time split with a 182 day test period (2026-04-03 to 2026-10-01), no gap, and four expanding 91 day
      CV folds.
    reason: The model forecasts the future; the 2 day horizon is enforced by the feature lags, and longer windows
      give stable scores.
  - date: '2026-10-20'
    stage: features
    decision: Same day weather columns are used only as lags of 2 days; redundant location columns are left out.
    reason: The user confirmed (Q3, Q4) that they are known only from the last complete day.
  - date: '2026-10-20'
    stage: features
    decision: Custom features temp_max_change_1d and temp_max_vs_28d_mean.
    reason: The user asked for them as domain features.
  - date: '2026-10-20'
    stage: features
    decision: 'Confirmed as safe: the target lags 2 and 3, the 7 and 28 day rolling means, and the 2 day lags of
      temperature_2m_mean and apparent_temperature_max, despite associations above 0.9.'
    reason: Each ends at least 2 days before the target date (min_shift_days = 2, enforced by the feature code);
      temperature is persistent, so a high association is expected. Lag 2 is the persistence forecast itself.
  - date: '2026-10-20'
    stage: baseline
    decision: Baselines are persistence (lag 2), seasonal naive (lag 364), and a 28 day moving average; the reference
      is the best of them.
    reason: The project is exploratory, with no current approach; the user chose these three.
  - date: '2026-10-20'
    stage: training
    decision: Build ridge and LightGBM with quick tuning (20 trials each).
    reason: The user chose them; a simple and a complex model, compared on the same folds.
  - date: '2026-10-20'
    stage: evaluation
    decision: 'Go: promote lightgbm as the V1 champion and build the serving stack around it.'
    reason: It beats persistence on the test set by 0.36 degrees (14.9%, interval 0.32 to 0.41), meets the V1 bar
      on CV and test, beats persistence in every city, month, and latitude band, and shows no accuracy decay over
      26 weeks. This matches the answer action for beating persistence by 10% or more.
    superseded_by: 'Go: promote lightgbm as the V1 champion and build the serving stack around it; it is never significantly
      worse than persistence in any city.'
    superseded_on: '2026-10-20'
  - date: '2026-10-20'
    stage: iteration
    decision: 'Closed iteration 1 (V2): rolled back.'
    reason: 'Target encoding city and country did not help: on the same folds LightGBM with the V1 settings scored
      2.1637 against 2.1630 with ordinal city, the retuned LightGBM 2.1648, and ridge got worse (2.2440 against
      2.2301). The iteration bar failed, so V1 stays.'
  - date: '2026-10-20'
    stage: evaluation
    decision: 'Go: promote lightgbm as the V1 champion and build the serving stack around it; it is never significantly
      worse than persistence in any city.'
    reason: It beats persistence on the test set by 0.36 degrees (14.9%, interval 0.32 to 0.41), meets the V1 bar
      on CV and test, beats persistence in every month and latitude band, and is never significantly worse in any
      city (Casablanca and Mumbai are ties, with intervals that include zero), and shows no accuracy decay over
      26 weeks. This matches the answer action for beating persistence by 10% or more.
  - date: '2026-10-21'
    stage: system
    decision: Use Hopsworks for the deployed system, including the registry, champion, and challenger; MLflow keeps
      local experiments.
    reason: The user chose it at the start of the design.
  - date: '2026-10-21'
    stage: system
    decision: The promotion gate is a paired one sided Diebold-Mariano test on daily MAE at alpha 0.05, with a recent
      28 day holdout for the challenger entry, manual promotion, and the previous champion in shadow for 28 days.
    reason: The user chose statistical significance over a fixed margin; the CV std margin reflected seasonal difficulty,
      not the noise of a paired comparison.
  - date: '2026-10-21'
    stage: system
    decision: When inputs are stale, serve persistence for up to 3 days, then the seasonal naive.
    reason: The user's answer to Q1 (serve the baseline), refined so every request gets a forecast.
  - date: '2026-10-22'
    stage: system
    decision: 'Deploy with Hopsworks Git integration: every merge to main runs deploy.apply and deploy.smoke from
      GitHub Actions; jobs are set in each pipeline''s jobs/jobs.yaml.'
    reason: The user chose it while planning the deployment; see docs/deployment.md.
  - date: '2026-10-22'
    stage: system
    decision: No component tests and no Hopsworks test project; the system runs on Hopsworks Serverless (eu-west)
      in the project weather_online_inference.
    reason: 'The user''s answer to Q5: CI runs unit tests only, including the skew test on a fixture.'
