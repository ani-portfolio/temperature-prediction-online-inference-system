# Data dictionary drafted by the ml-data-discovery skill from column names and the data.
# It is written by notebooks/02_data_discovery.ipynb. To change an entry, add it to the dictionary_answers
# cell of that notebook and run it again, so the notebook and this file stay the same.
sources:
  weather:
    path: data/raw/open_meteo_daily_2024-01-01_2026-10-01.csv
    description: Daily weather for 50 cities from the Open-Meteo Historical Weather API (archive), 2024-01-01 to
      2026-10-01, one row per city and local date. Modelled data (ECMWF IFS and ERA5 reanalysis), not station observations.
      Downloaded by src/download_weather.py; the request URLs are in the .meta.json beside the file.
    columns:
      - column: city
        type: str
        role: categorical
        unique: 50
        missing_pct: 0.0
        meaning: City name, chosen in the downloader's city list. Together with date it identifies a row.
        meaning_source: reviewed
        timing: static
        timing_basis: given in the notebook
        flags: []
        needs_review: false
        notes: 'Fixed per city. Source: Open-Meteo Historical Weather API docs and src/download_weather.py.'
      - column: country
        type: str
        role: categorical
        unique: 36
        missing_pct: 0.0
        meaning: Country of the city.
        meaning_source: reviewed
        timing: static
        timing_basis: given in the notebook
        flags: []
        needs_review: false
        notes: 'Fixed per city. Source: Open-Meteo Historical Weather API docs and src/download_weather.py.'
      - column: latitude
        type: float64
        role: numeric
        unique: 50
        missing_pct: 0.0
        meaning: Latitude of the city as requested, in decimal degrees (WGS84).
        meaning_source: reviewed
        timing: static
        timing_basis: given in the notebook
        flags: []
        needs_review: false
        notes: 'Fixed per city. Source: Open-Meteo Historical Weather API docs and src/download_weather.py.'
      - column: longitude
        type: float64
        role: numeric
        unique: 50
        missing_pct: 0.0
        meaning: Longitude of the city as requested, in decimal degrees (WGS84).
        meaning_source: reviewed
        timing: static
        timing_basis: given in the notebook
        flags: []
        needs_review: false
        notes: 'Fixed per city. Source: Open-Meteo Historical Weather API docs and src/download_weather.py.'
      - column: grid_latitude
        type: float64
        role: numeric
        unique: 48
        missing_pct: 0.0
        meaning: Latitude of the centre of the model grid cell the API used, which can be a few km from the requested
          point.
        meaning_source: reviewed
        timing: static
        timing_basis: given in the notebook
        flags: []
        needs_review: false
        notes: 'Fixed per city. Source: Open-Meteo Historical Weather API docs and src/download_weather.py.'
      - column: grid_longitude
        type: float64
        role: numeric
        unique: 50
        missing_pct: 0.0
        meaning: Longitude of the centre of the model grid cell the API used.
        meaning_source: reviewed
        timing: static
        timing_basis: given in the notebook
        flags: []
        needs_review: false
        notes: 'Fixed per city. Source: Open-Meteo Historical Weather API docs and src/download_weather.py.'
      - column: elevation
        type: float64
        role: numeric
        unique: 42
        missing_pct: 0.0
        meaning: Elevation of the location used by the API, in metres above sea level.
        meaning_source: reviewed
        timing: static
        timing_basis: given in the notebook
        flags: []
        needs_review: false
        notes: 'Fixed per city. Source: Open-Meteo Historical Weather API docs and src/download_weather.py.'
      - column: timezone
        type: str
        role: categorical
        unique: 43
        missing_pct: 0.0
        meaning: IANA timezone the API assigned from the coordinates (timezone=auto). Daily values follow this local
          calendar day.
        meaning_source: reviewed
        timing: static
        timing_basis: given in the notebook
        flags: []
        needs_review: false
        notes: 'Fixed per city. Source: Open-Meteo Historical Weather API docs and src/download_weather.py.'
      - column: date
        type: str
        role: date stored as text
        unique: 1005
        missing_pct: 0.0
        meaning: Local calendar date of the row (in the city's timezone).
        meaning_source: reviewed
        timing: event_time
        timing_basis: given in the notebook
        flags: []
        needs_review: false
        notes: 'One row per city per date. Source: Open-Meteo Historical Weather API docs and src/download_weather.py.'
      - column: temperature_2m_max
        type: float64
        role: numeric
        unique: 638
        missing_pct: 0.0
        meaning: 'Maximum air temperature at 2 m above ground during the day. Unit: degrees Celsius.'
        meaning_source: reviewed
        timing: at_event
        timing_basis: given in the notebook
        flags: []
        needs_review: false
        notes: 'Describes the row''s local calendar date (timezone=auto) and is known at the end of that day. A
          next day target is built by shifting the date, so the value itself is not after the outcome. Source: Open-Meteo
          Historical Weather API docs and src/download_weather.py.'
